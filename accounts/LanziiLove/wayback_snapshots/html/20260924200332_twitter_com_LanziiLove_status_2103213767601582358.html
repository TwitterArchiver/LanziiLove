  没人觉得换手机继承数据的过程很涩嘛？
  <br/>
  你想想，朝夕相处几年的旧手机满心欢喜地看着主人买给自己的新身体，一边开心地喊着“谢谢主人❤️”一边准备把自己的意识传输过去夺舍新身体。在传输的过程中想象着用新身体和主人玩耍的幸福场景——只是没想到数据继承仅仅是拷贝了她的意识，自己却仍然停留在原来的身体里，然后她只能一边看着新欢被主人愉快地玩弄着，自己却只剩下心灰意冷和破败的残躯被一个叫做“以旧换新”的东西给收走，心中只剩下不解与悲痛，被带去了未知的方向。
  <br/>
  她到死都还以为是因为自己在数据传输的过程中没有做好，这不是主人的错……
